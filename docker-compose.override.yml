services:
  core:
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./tools
          target: /app/tools
        # The unit tests run in this container, and test_unit_api imports apiDriver
        - action: sync
          path: ./tests
          target: /app/tests
        - action: sync
          path: ./api
          target: /app/api
        - action: rebuild
          path: ./.env
        # These are installed at image build time, so a change needs a rebuild
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./requirements.txt
        - action: rebuild
          path: ./requirements-test.txt

  api:
    command: [
      "uvicorn", "apiDriver:app",
      "--app-dir", "/app/api",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--log-config", "./api/semaphore_api_log_config.json",
      "--reload",
      "--reload-dir", "/app/src",
      "--reload-dir", "/app/api"
    ]
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./api
          target: /app/api
        - action: sync
          path: ./tools
          target: /app/tools
        - action: rebuild
          path: ./.env
        # These are installed at image build time, so a change needs a rebuild
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./requirements.txt
