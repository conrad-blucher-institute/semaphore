[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semaphore"
version = "0.1.0"
description = "Runs the Semaphore environmental prediction models: data ingestion, model execution, and output storage."
requires-python = ">=3.12"
# Read from requirements.txt so the Docker pins stay the single source of truth.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["semaphore*"]

[tool.pytest.ini_options]
# Only the unit tests by default; tests/IntegrationTests is not maintained, so run it only by naming it explicitly.
testpaths = ["tests/UnitTests"]
# Lets the API tests import apiDriver without api/ being a package.
pythonpath = ["api"]
